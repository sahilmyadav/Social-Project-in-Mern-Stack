# Social App - Docker Compose (Production)
# Domain: clikkme.in
# VPS: 12 cores / 46GB RAM / 1.6TB disk — FULL UTILIZATION MODE
# Usage: sudo docker compose down && sudo docker compose up -d --build

services:
  # Backend API — Cluster mode, 10 workers, access to ALL 12 cores
  backend:
    build: ./backend
    container_name: social-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - MONGO_URL=mongodb://mongo:27017/${DB_NAME:-social_media_app}
      - ENABLE_CLUSTER=true
      - CLUSTER_WORKERS=10
      - UV_THREADPOOL_SIZE=24
    ports:
      - '5000:5000'
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - social-network
    deploy:
      resources:
        limits:
          cpus: '12'
          memory: 16G
        reservations:
          cpus: '4'
          memory: 4G
    command: [ "node", "src/cluster.js" ]
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Frontend Next.js — access to ALL cores for SSR
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL in .env}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:?Set NEXT_PUBLIC_SOCKET_URL in .env}
        NEXT_PUBLIC_ENCRYPTION_KEY: ${NEXT_PUBLIC_ENCRYPTION_KEY:?Set NEXT_PUBLIC_ENCRYPTION_KEY in .env}
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME:-}
    container_name: social-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - backend
    networks:
      - social-network
    deploy:
      resources:
        limits:
          cpus: '12'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 1G
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MongoDB — 12GB WiredTiger cache, access to ALL cores
  mongo:
    image: mongo:7
    container_name: social-mongo
    restart: unless-stopped
    command: >
      mongod --wiredTigerCacheSizeGB 12 --wiredTigerCollectionBlockCompressor zstd --wiredTigerJournalCompressor zstd --setParameter diagnosticDataCollectionEnabled=false
    volumes:
      - mongo-data:/data/db
    ports:
      - '27017:27017'
    networks:
      - social-network
    deploy:
      resources:
        limits:
          cpus: '12'
          memory: 18G
        reservations:
          cpus: '2'
          memory: 6G
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Redis — in-memory store for Socket.IO adapter & online user tracking
  redis:
    image: redis:7-alpine
    container_name: social-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - '6379:6379'
    networks:
      - social-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  social-network:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
