# Social App - Docker Compose
# Domain: clikkme.in
# Usage: sudo docker-compose down && sudo docker-compose up -d --build

services:
  # Backend API
  backend:
    build: ./backend
    container_name: social-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_URL=redis://redis:6379
    ports:
      - '5000:5000'
    depends_on:
      - redis
    networks:
      - social-network

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://clikkme.in/api/v1
        NEXT_PUBLIC_API_BASE_URL: https://clikkme.in/api/v1
        NEXT_PUBLIC_SOCKET_URL: https://clikkme.in
        NEXT_PUBLIC_ENCRYPTION_KEY: your-super-secret-encryption-key-change-in-production-2024
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: dltbikmc6
    container_name: social-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - backend
    networks:
      - social-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: social-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - social-network

networks:
  social-network:
    driver: bridge

volumes:
  redis-data:
