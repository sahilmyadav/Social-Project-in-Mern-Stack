# Social App - Docker Compose
# Domain: clikkme.in
# Usage: sudo docker compose down && sudo docker compose up -d --build

services:
  # Backend API
  backend:
    build: ./backend
    container_name: social-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_URL=redis://172.17.0.1:6379
      - MONGO_URL=mongodb://mongo:27017/social_media_app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - '5000:5000'
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - mongo
    networks:
      - social-network

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://clikkme.in/api/v1
        NEXT_PUBLIC_API_BASE_URL: https://clikkme.in/api/v1
        NEXT_PUBLIC_SOCKET_URL: https://clikkme.in
        NEXT_PUBLIC_ENCRYPTION_KEY: your-super-secret-encryption-key-change-in-production-2024
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: dltbikmc6
    container_name: social-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - backend
    networks:
      - social-network

  # MongoDB
  mongo:
    image: mongo:7
    container_name: social-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - social-network

networks:
  social-network:
    driver: bridge

volumes:
  mongo-data:
