# Social App - Nginx Configuration for clikkme.in (Cloudflare Tunnel)
# SSL is handled by Cloudflare, nginx only serves HTTP on port 80

upstream social_backend {
    ip_hash;
    server 127.0.0.1:5000;
    keepalive 32;
}

upstream social_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name clikkme.in www.clikkme.in;

    # Max upload size
    client_max_body_size 50M;

    # Backend API
    location /api/ {
        proxy_pass http://social_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }

    # WebSocket (Socket.IO)
    location /socket.io/ {
        proxy_pass http://social_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Video files — serve directly from disk with nginx (bypasses Node.js entirely)
    # nginx handles range requests natively and is 10-50x faster than Node for static files
    location ~* ^/uploads/.+\.(mp4|webm|mov|avi|mkv)$ {
        alias /home/clickme/social-app/backend/uploads/;
        # Rewrite: /uploads/reels/file.mp4 → /home/clickme/social-app/backend/uploads/reels/file.mp4
        rewrite ^/uploads/(.*)$ /$1 break;
        root /home/clickme/social-app/backend/uploads;

        # Enable range requests (critical for video streaming)
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options nosniff always;

        # Aggressive caching
        expires 30d;
        etag on;

        # Limit video download speed after initial burst (prevents bandwidth abuse)
        # First 5MB at full speed (fast start), then limit to 5MB/s
        limit_rate_after 5m;
        limit_rate 5m;
    }

    # Static uploads (images, other files) - serve from backend with caching
    location /uploads/ {
        proxy_pass http://social_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Cache static files for 30 days
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Frontend (Next.js)
    location / {
        proxy_pass http://social_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Enable proxy buffering for better performance
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
