# ============================================================================
# Nginx Performance Tuning for ClickME VPS
# ============================================================================
# VPS: Intel i7-8700T (12 threads) / 46GB RAM / 1.6TB SSD
#
# Include this in your main /etc/nginx/nginx.conf or copy settings there:
#   worker_processes auto;
#   include /path/to/this/performance.conf;
#
# Or apply these settings directly in /etc/nginx/nginx.conf
# ============================================================================

# ─── Worker Settings (include in main context) ───────────────────────────────
# worker_processes auto;           # = 12 on this VPS (one per CPU thread)
# worker_rlimit_nofile 65535;      # Max open files per worker

# ─── Events Block Settings ───────────────────────────────────────────────────
# events {
#     worker_connections 4096;     # 12 workers × 4096 = 49,152 concurrent
#     multi_accept on;             # Accept multiple connections at once
#     use epoll;                   # Linux high-performance event model
# }

# ─── HTTP Block Settings (paste inside http { }) ─────────────────────────────

# TCP optimizations
sendfile on;
tcp_nopush on;
tcp_nodelay on;

# Timeouts
keepalive_timeout 65;
keepalive_requests 1000;
client_body_timeout 30;
client_header_timeout 30;
send_timeout 30;
reset_timedout_connection on;

# Buffer sizes
client_body_buffer_size 128k;
client_header_buffer_size 4k;
large_client_header_buffers 4 16k;
client_max_body_size 100m;

# Hash tables
types_hash_max_size 2048;
server_names_hash_bucket_size 64;

# Logging — reduce I/O on access log
access_log /var/log/nginx/access.log combined buffer=64k flush=5s;

# Disable server tokens
server_tokens off;

# ─── How to apply: ───────────────────────────────────────────────────────────
# 1. Edit /etc/nginx/nginx.conf:
#    - Set: worker_processes auto;
#    - Set: worker_rlimit_nofile 65535;
#    - In events { }: worker_connections 4096; multi_accept on; use epoll;
#    - In http { }: include /path/to/social-app/nginx/performance.conf;
#
# 2. Also set OS limits:
#    echo "* soft nofile 65535" >> /etc/security/limits.conf
#    echo "* hard nofile 65535" >> /etc/security/limits.conf
#    echo "net.core.somaxconn = 65535" >> /etc/sysctl.conf
#    echo "net.ipv4.tcp_max_syn_backlog = 65535" >> /etc/sysctl.conf
#    echo "net.ipv4.ip_local_port_range = 1024 65535" >> /etc/sysctl.conf
#    echo "net.ipv4.tcp_tw_reuse = 1" >> /etc/sysctl.conf
#    echo "vm.swappiness = 10" >> /etc/sysctl.conf
#    sysctl -p
#
# 3. Create cache directory:
#    mkdir -p /var/cache/nginx/social
#    chown nginx:nginx /var/cache/nginx/social
#
# 4. Reload: sudo nginx -t && sudo systemctl reload nginx
