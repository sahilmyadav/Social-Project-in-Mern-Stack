# Social App - Nginx Configuration for clikkme.in (HTTPS with SSL)
# VPS: 12 cores / 46GB RAM — tuned for maximum performance
# For use with Let's Encrypt SSL certificates

upstream social_backend {
    ip_hash;  # sticky sessions — same client always hits same worker (needed for Socket.IO)
    server 127.0.0.1:5000;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

upstream social_frontend {
    server 127.0.0.1:3000;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# ─── Proxy Cache Zone (store responses in RAM-backed tmpfs or fast SSD) ───
proxy_cache_path /var/cache/nginx/social levels=1:2 keys_zone=social_cache:50m
                 max_size=2g inactive=60m use_temp_path=off;

# ─── Open File Cache (reduce filesystem syscalls) ───
open_file_cache max=10000 inactive=30s;
open_file_cache_valid 60s;
open_file_cache_min_uses 2;
open_file_cache_errors on;

# Gzip compression — tuned for throughput
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 4;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml application/wasm font/woff2;
gzip_min_length 256;

# HTTP - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name clikkme.in www.clikkme.in;

    # For SSL certificate verification
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS - Main Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clikkme.in www.clikkme.in;

    # SSL Certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/clikkme.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clikkme.in/privkey.pem;

    # SSL Configuration
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Max upload size (0 = unlimited)
    client_max_body_size 0;

    # Backend API
    location /api/ {
        proxy_pass http://social_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }

    # WebSocket (Socket.IO)
    location /socket.io/ {
        proxy_pass http://social_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Static uploads (images, videos) - serve from backend with caching
    location /uploads/ {
        proxy_pass http://social_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # Enable range requests for video streaming (progressive loading)
        proxy_force_ranges on;

        # Disable buffering for streaming
        proxy_buffering off;

        # Cache static files for 30 days
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Accept-Ranges bytes;
    }

    # Video files - optimized for streaming (serve directly from disk, bypass Node.js)
    location ~* /uploads/.*\.(mp4|webm|mov|avi|mkv)$ {
        # Serve videos directly from the filesystem — MUCH faster than proxying through Node.js
        # URL: /uploads/reels/file.mp4 → /home/clickme/social-app/backend/uploads/reels/file.mp4
        root /home/clickme/social-app/backend;

        # Enable range requests (critical for video seeking and progressive loading)
        add_header Accept-Ranges bytes always;

        # Cache videos aggressively — they're immutable once uploaded
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;

        # Proper CORS headers for video
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;

        # Optimize TCP for large file transfer
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        aio on;
        directio 512k;
        output_buffers 2 1m;

        # Disable access log for video files — reduces I/O
        access_log off;

        # If file not found on disk, fall back to Node.js backend
        try_files $uri @video_backend;
    }

    # Fallback for videos not found on disk
    location @video_backend {
        proxy_pass http://social_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_force_ranges on;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Frontend (Next.js) — with micro-caching for HTML pages
    location / {
        proxy_pass http://social_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Micro-cache HTML pages for 1 second — eliminates thundering herd
        proxy_cache social_cache;
        proxy_cache_valid 200 1s;
        proxy_cache_valid 404 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        add_header X-Cache-Status $upstream_cache_status;

        # Enable proxy buffering for better performance
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Next.js static files - aggressive caching
    location /_next/static/ {
        proxy_pass http://social_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Images and media - cache for 30 days
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif|mp4|webm)$ {
        proxy_pass http://social_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Fonts - cache for 1 year
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        proxy_pass http://social_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}
